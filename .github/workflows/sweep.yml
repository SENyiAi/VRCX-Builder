name: Sweep Run History

on:
  schedule:
    # 每 20 分钟清扫一次已完成/已取消的历史 run 与缓存；
    # 构建自身的阅后即焚失败时，由此兜底，最坏残留 ≤20 分钟。
    # 错开整点刻度（:00/:20/:40），规避 GitHub 调度高峰导致的延迟或丢触发。
    - cron: '7,27,47 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sweep-run-history
  cancel-in-progress: false

jobs:
  sweep:
    name: Delete Completed Runs And Caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete Completed Runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/actions/runs?per_page=100&status=completed" \
            --jq '.workflow_runs[] | select(.id != '"${GITHUB_RUN_ID}"') | .id' \
            | while read -r id; do
                gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/${id}" \
                  && echo "deleted run ${id}" || echo "WARN: failed to delete run ${id}"
              done

      - name: Delete Caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[].id' \
            | while read -r id; do
                gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/${id}" \
                  && echo "deleted cache ${id}" || echo "WARN: failed to delete cache ${id}"
              done
