name: Build Windows App

on:
  repository_dispatch:
    types: [trigger-build]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Private repo branch to build'
        required: true
        default: 'master'

permissions:
  actions: write
  contents: read

concurrency:
  group: windows-build-${{ github.event.client_payload.branch || github.event.inputs.branch || 'master' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PRIVATE_REPO: 'SENyiAi/VRCX-1'
      TARGET_BRANCH: ${{ github.event.client_payload.branch || github.event.inputs.branch || 'master' }}
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: |
          npm ci --no-fund --no-audit > deps.log 2>&1 || {
            echo "npm ci failed:"
            tail -n 40 deps.log
            exit 1
          }

      - name: Prepare Tauri Windows Config
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tauriConfigPath = 'src-tauri/tauri.conf.json';
          const outputConfigPath = 'src-tauri/tauri.build.windows.json';
          const config = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'));

          config.bundle ??= {};
          config.bundle.createUpdaterArtifacts = false;
          config.bundle.targets = ['nsis'];
          if (config.bundle.windows) {
              delete config.bundle.windows.certificateThumbprint;
              delete config.bundle.windows.signCommand;
          }
          fs.writeFileSync(outputConfigPath, JSON.stringify(config, null, 2));
          NODE

      - name: Build Windows Package
        env:
          VRCX_0_BUILD_LABEL: 'release'
        run: |
          npm run tauri:build -- --config src-tauri/tauri.build.windows.json --no-sign --bundles nsis \
            > build.log 2>&1 || {
              echo "build failed:"
              tail -n 80 build.log
              exit 1
            }
          echo "build ok"

      - name: Collect Dist Artifacts
        id: collect
        run: |
          mkdir -p package-assets
          mkdir -p portable-dist

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          timestamp="$(date +'%Y%m%d-%H%M')"
          stem="VRCX-0_${version}_${timestamp}"

          source="target/release/vrcx-0.exe"
          nsis_dir="target/release/bundle/nsis"

          # 1. 便携单文件
          cp "$source" "package-assets/${stem}_portable.exe"

          # 2. 便携 zip 包
          cp "$source" "portable-dist/VRCX-0.exe"
          (cd portable-dist && 7z a "../package-assets/${stem}_portable.zip" *)

          # 3. NSIS 安装包
          if compgen -G "${nsis_dir}/*.exe" > /dev/null; then
              for f in "${nsis_dir}"/*.exe; do
                  cp "$f" "package-assets/${stem}_setup.exe"
              done
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${version}-${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Upload to Private Repo Release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh release create "${{ steps.collect.outputs.tag_name }}" \
            --repo "${{ env.PRIVATE_REPO }}" \
            --title "VRCX-0 ${{ steps.collect.outputs.version }} (${{ steps.collect.outputs.tag_name }})" \
            --notes "Automated private release build" \
            package-assets/*

      # 失败诊断：构建日志尾部推回私有库 diagnostics 分支（不公开），供本地读取定位
      - name: Upload Build Diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          {
            echo "=== build.log tail ==="
            tail -n 150 build.log 2>/dev/null || echo "(no build.log)"
            echo "=== deps.log tail ==="
            tail -n 40 deps.log 2>/dev/null || echo "(no deps.log)"
            echo "=== disk ==="
            df -h / 2>/dev/null || true
          } > diagnostics.log
          git config user.email "ci@vrcx-0.local"
          git config user.name "vrcx-0-diagnostics"
          git checkout --orphan diagnostics-tmp
          git reset
          git add -f diagnostics.log
          git commit -m "build diagnostics $(date -u +%FT%TZ)"
          git push --force origin diagnostics-tmp:diagnostics

      # 阅后即焚：用本仓库自身的 GITHUB_TOKEN（对 Builder 必有写权限）删除本次运行记录与日志。
      # 此前误用仅限私有库的 PRIVATE_REPO_TOKEN 导致 403 被 || true 吞掉，run 全部残留公开侧。
      # 失败的 run 保留（供浏览器排查），仅成功时清理。
      - name: Clean Public Run History
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}" \
            || echo "WARN: self-delete failed; orphan sweep on next dispatch will remove this run"
